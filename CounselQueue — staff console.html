<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CounselQueue — counselling desk console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12356B; --blue:#2B6CB8; --sky:#E9F1FB; --paper:#F4F8FD; --card:#FFFFFF;
  --amber:#D98A16; --amber-soft:#FBEFD9; --rose:#B3261E; --rose-soft:#FBE7E5;
  --ink:#0F1F35; --muted:#5A6D85; --line:#DCE6F2; --line-strong:#BFD0E4;
  --ok:#12795C; --ok-soft:#DDF1EA;
  --r-s:6px; --r-m:12px; --r-l:20px;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --shadow:0 1px 2px rgba(18,43,39,.06),0 8px 24px -16px rgba(18,43,39,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#8FB8EC; --blue:#A8CBF3; --sky:#16273D; --paper:#0A1626; --card:#122238;
    --ink:#E6EEF8; --muted:#9AAEC6; --line:#22354F; --line-strong:#33496A;
    --amber-soft:#3A2D10; --rose-soft:#3B1B18; --ok-soft:#0F2E26;
  }
}
:root[data-theme="dark"]{
  --navy:#8FB8EC; --blue:#A8CBF3; --sky:#16273D; --paper:#0A1626; --card:#122238;
  --ink:#E6EEF8; --muted:#9AAEC6; --line:#22354F; --line-strong:#33496A;
  --amber-soft:#3A2D10; --rose-soft:#3B1B18; --ok-soft:#0F2E26;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}

/* ---------- demo harness ---------- */
#harness{position:sticky;top:0;z-index:60;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:8px 14px;background:var(--navy);color:#F2F7FE}
:root[data-theme="dark"] #harness, :root:not([data-theme="light"]) #harness{color:#0A1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #harness{background:var(--navy);color:#0A1626}}
#harness .brand{font-family:var(--serif);font-size:19px;letter-spacing:.2px;margin-right:10px;white-space:nowrap}
#harness .brand em{font-style:italic;opacity:.85}
.rolebtn{padding:5px 11px;border-radius:999px;font-size:13px;font-weight:500;opacity:.72;border:1px solid transparent}
.rolebtn[aria-current="true"]{background:rgba(255,255,255,.16);opacity:1;border-color:rgba(255,255,255,.28)}
#harness .spacer{flex:1}
.hbtn{font-size:12.5px;padding:5px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;opacity:.85}
.clock{font-size:12.5px;font-variant-numeric:tabular-nums;opacity:.8;padding-right:4px}

/* ---------- layout ---------- */
.screen{min-height:calc(100vh - 46px)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 46px)}
.rail{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.rail .who{padding:6px 10px 14px}
.rail .who b{display:block;font-size:15px}
.rail .who span{font-size:12.5px;color:var(--muted)}
.navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:14px;color:var(--muted);text-align:left;width:100%}
.navitem b{font-weight:500}
.navitem[aria-current="true"]{background:var(--sky);color:var(--ink)}
.navitem .cnt{margin-left:auto;font-size:12px;background:var(--line);padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.navitem[aria-current="true"] .cnt{background:var(--card)}
.main{padding:22px 26px 60px;max-width:1180px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}
.pagehead .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:.1px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:9px;
  background:var(--navy);color:#FFFFFF;font-weight:500;font-size:14px;border:1px solid var(--navy)}
:root[data-theme="dark"] .btn{color:#0A1626}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
:root[data-theme="dark"] .btn.ghost,:root[data-theme="dark"] .btn.danger{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0A1626}
  :root:not([data-theme="light"]) .btn.ghost,:root:not([data-theme="light"]) .btn.danger{color:var(--ink)}
  :root:not([data-theme="light"]) .segbtn[aria-current="true"]{color:#0A1626}}
.btn.ghost:hover{background:var(--sky);border-color:var(--line-strong)}
.btn.warn{background:var(--amber);border-color:var(--amber);color:#4A3204}
.btn.danger{background:transparent;color:var(--rose);border-color:var(--rose)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 22px;font-size:16px;border-radius:12px;width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;
  background:var(--sky);color:var(--ink);border:1px solid transparent}
.pill.amber{background:var(--amber-soft);color:#8A5A0B}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}
.pill.grey{background:var(--line);color:var(--muted)}
:root[data-theme="dark"] .pill.amber{color:var(--amber)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.stat .n{font-family:var(--serif);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat .d{font-size:12px;margin-top:4px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:500;margin-bottom:5px}
label.f>small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--card)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.err{color:var(--rose);font-size:12.5px;margin-top:4px;display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m)}
.tok{font-family:var(--serif);font-size:17px;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.segment{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:4px;margin-bottom:16px}
.segbtn{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.segbtn:hover{background:var(--sky)}
.segbtn[aria-current="true"]{background:var(--navy);color:#FFF}
:root[data-theme="dark"] .segbtn[aria-current="true"]{color:#0A1626}
.segbtn .c{font-size:12px;background:var(--line);color:var(--ink);padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.segbtn[aria-current="true"] .c{background:rgba(255,255,255,.22);color:inherit}
.segbtn .sm{font-size:11.5px;opacity:.8;font-weight:400}
.searchrow{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.searchrow input{max-width:360px}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:500;margin-bottom:5px}
.rowsplit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.sep{height:1px;background:var(--line);margin:14px 0}

/* ---------- queue cards ---------- */
.qitem{display:flex;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--card);margin-bottom:8px}
.qitem.next{border-color:var(--amber);background:var(--amber-soft)}
.qitem.late{border-color:var(--rose)}
.qitem .num{font-family:var(--serif);font-size:20px;min-width:74px;font-variant-numeric:tabular-nums}
.qitem .nm{font-weight:500}
.qitem .meta{font-size:12.5px;color:var(--muted)}
.qitem .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- student phone ---------- */
.phonewrap{display:flex;justify-content:center;padding:26px 14px 60px;background:
  radial-gradient(1200px 400px at 50% -80px, var(--sky), transparent 70%)}
.phone{width:100%;max-width:412px;background:var(--card);border:1px solid var(--line);border-radius:26px;
  box-shadow:var(--shadow);overflow:hidden}
.phone .bar{background:var(--navy);color:#EDF4FF;padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:13px}
:root[data-theme="dark"] .phone .bar{color:#0A1626}
.phone .body{padding:20px 18px 26px}
.phone h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 6px;line-height:1.15}
.phone p.lede{margin:0 0 18px;color:var(--muted);font-size:14px}
.ticket{border:1px solid var(--line-strong);border-radius:var(--r-l);overflow:hidden;background:var(--card)}
.ticket .top{padding:22px 18px 18px;text-align:center;background:var(--sky)}
.ticket .top .lbl{font-size:12.5px;color:var(--muted)}
.ticket .top .big{font-family:var(--serif);font-size:58px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.perf{height:0;border-top:2px dashed var(--line-strong);position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.perf::before{left:-9px} .perf::after{right:-9px}
.ticket .bot{padding:16px 18px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.qr{width:150px;height:150px;margin:0 auto;display:block}
.stepdots{display:flex;gap:6px;margin-bottom:16px}
.stepdots i{height:3px;flex:1;background:var(--line);border-radius:2px}
.stepdots i.on{background:var(--navy)}
.notice{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r-m);padding:13px 14px;font-size:13.5px;margin-bottom:14px}
.notice b{display:block;margin-bottom:3px}
.wa{background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--r-m);padding:13px 14px;font-size:13.5px}

/* ---------- board ---------- */
.board{background:var(--navy);color:#EEF4FD;min-height:calc(100vh - 46px);padding:26px 30px}
.board h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.board .sub{opacity:.72;font-size:13.5px}
.deskgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:22px}
.desk{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:var(--r-m);padding:16px}
.desk .who{font-size:13.5px;opacity:.78}
.desk .serving{font-family:var(--serif);font-size:46px;line-height:1.05;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.desk .nxt{font-size:12.5px;opacity:.7}
.desk.idle .serving{opacity:.35}
.board .ticker{margin-top:24px;border-top:1px solid rgba(255,255,255,.18);padding-top:14px;font-size:13.5px;opacity:.85}

/* ---------- modal + toast ---------- */
.modalbg{position:fixed;inset:0;background:rgba(12,30,27,.5);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px}
.modal{background:var(--card);border-radius:var(--r-l);max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.modal h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 4px}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.modalfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--ink);color:#FFFFFF;padding:11px 14px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok)} .toast.warn{background:var(--amber);color:#4A3204} .toast.bad{background:var(--rose);color:#FFF}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:10px}
  .rail .who{display:none}
  .navitem{width:auto;white-space:nowrap}
  .main{padding:16px 14px 50px}
}
</style>
<style>
.topbar{display:flex;align-items:center;gap:12px;padding:9px 18px;background:var(--navy);color:#EDF4FF;
  position:sticky;top:0;z-index:60;flex-wrap:wrap}
:root[data-theme="dark"] .topbar{color:#0A1626}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .topbar{color:#0A1626}}
.topbar .brand{font-family:var(--serif);font-size:19px;white-space:nowrap}
.topbar .brand em{font-style:italic;opacity:.85}
.topbar .where{font-size:12.5px;opacity:.78;border-left:1px solid rgba(255,255,255,.28);padding-left:12px}
.topbar .spacer{flex:1}
.topbar .clock{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
.topbar .hbtn{font-size:12.5px;padding:5px 10px;border:1px solid rgba(255,255,255,.32);border-radius:999px;opacity:.9}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px}
.userchip .av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600}
.userchip .nm{line-height:1.2}
.userchip .rl{font-size:11px;opacity:.75}
.loginwrap{display:grid;grid-template-columns:1.02fr 1fr;min-height:100vh}
.loginaside{background:var(--navy);color:#EAF2FE;padding:46px 46px 34px;display:flex;flex-direction:column}
.loginaside .mark{font-family:var(--serif);font-size:21px}
.loginaside .mark em{font-style:italic;opacity:.85}
.loginaside .mid{margin:auto 0}
.loginaside h1{font-family:var(--serif);font-weight:400;font-size:37px;line-height:1.12;margin:0 0 16px;max-width:15ch}
.loginaside p{font-size:14.5px;opacity:.8;max-width:42ch;line-height:1.6;margin:0}
.loginaside .foot{font-size:12.5px;opacity:.7;border-top:1px solid rgba(255,255,255,.18);padding-top:16px;line-height:1.6}
.loginaside .foot a{color:inherit}
.loginmain{display:flex;align-items:center;justify-content:center;padding:36px 24px}
.loginbox{width:100%;max-width:372px}
.loginbox .mobmark{display:none;font-family:var(--serif);font-size:21px;margin-bottom:22px}
@media(max-width:900px){.loginbox .mobmark{display:block}}
.loginbox h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:0 0 4px}
.loginbox .sub{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.pwwrap{display:block;position:relative}
.pwwrap input{padding-right:62px}
.pwtoggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12.5px;
  color:var(--navy);padding:5px 8px;border-radius:7px;font-weight:500}
.pwtoggle:hover{background:var(--sky)}
.linkbtn{color:var(--navy);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.alert{display:flex;gap:9px;background:var(--rose-soft);border:1px solid var(--rose);color:var(--rose);
  border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px;line-height:1.45}
.loginfoot{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.7}
.loginfoot a{color:var(--muted)}
.demokeys{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.demokeys table{font-size:12.5px}
.demokeys td{padding:5px 8px 5px 0;border:none}
.acct{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:7px;background:var(--card)}
.acct:hover{border-color:var(--navy);background:var(--sky)}
.acct .av{width:29px;height:29px;border-radius:50%;background:var(--sky);color:var(--navy);display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.acct b{display:block;font-size:13px;font-weight:500}
.acct span{font-size:11.5px;color:var(--muted)}
@media(max-width:900px){
  .loginwrap{grid-template-columns:1fr}
  .loginaside{display:none}
  .loginmain{align-items:flex-start;padding-top:40px}
}
.ctxbar{display:flex;align-items:center;gap:10px;background:var(--amber-soft);border:1px solid var(--amber);
  border-radius:var(--r-m);padding:9px 13px;font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.railfoot{margin-top:auto;padding:10px}
.optbox{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:-6px 0 4px}
label.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:5px 0;line-height:1.4}
label.check input{width:auto;margin-top:2px;flex:0 0 auto}
@media(max-width:700px){.optbox{grid-template-columns:1fr}}
.boardfull .board{min-height:100vh}
.leaveboard{position:fixed;left:22px;bottom:22px;z-index:20;background:rgba(255,255,255,.14);
  color:#EEF4FD;border:1px solid rgba(255,255,255,.34)}
.leaveboard:hover{background:rgba(255,255,255,.24)}
</style>
</head>
<body>
<div id="toasts"></div>
<main id="root"></main>
<script>
"use strict";
/* ============================================================
   CounselQueue — offline counselling desk + token manager
   Single-file prototype. All state in memory, mirrored to
   localStorage so a refresh keeps the demo going.
   ============================================================ */

const STREAMS = [
  {code:"PCM",  name:"Science – PCM"},
  {code:"PCB",  name:"Science – PCB"},
  {code:"PCMB", name:"Science – PCMB"},
  {code:"COM",  name:"Commerce"},
  {code:"HUM",  name:"Humanities / Arts"},
  {code:"OTH",  name:"Other"}
];
const EXAMS = ["JEE","NEET","CUET","CLAT","Other","None / not sure"];
const CLARITY = ["Very clear","Have shortlisted options","Need help shortlisting","Completely confused"];
const HELP = ["College selection","Course selection","College & course comparison",
  "Admission / counselling","Cut-offs & college chances","Entrance exams","Other"];
const CLASSES = ["Class 11","Class 12","Dropper / repeat year","Graduate","Parent enquiring"];
const OUTCOMES = [
  {v:"hot", l:"Ready to apply"},
  {v:"warm", l:"Interested, needs time"},
  {v:"cold", l:"Just exploring"},
  {v:"na", l:"Not a fit"}
];
const uid = p => p + Math.random().toString(36).slice(2,8);
const now = () => Date.now();

/* ---------------- store ---------------- */
const KEY = "counselqueue.v5";
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const p = JSON.parse(raw); if(p && p.v===5) return p; } }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
S = load();

/* ---------------- selectors ---------------- */
const ev = id => S.events.find(e=>e.id===id);
const me = () => (S.users||[]).find(u=>u.id===S.session.authUserId) || null;
const co = id => S.counsellors.find(c=>c.id===id);
const st = id => S.students.find(s=>s.id===id);
const eventStudents = eid => S.students.filter(s=>s.eventId===eid);
const eventCounsellors = eid => S.counsellors.filter(c=>c.eventId===eid);
const queueFor = cid => S.students
  .filter(s=>s.counsellorId===cid && s.status==="waiting")
  .sort((a,b)=>a.checkinAt-b.checkinAt);
const currentOf = cid => S.students.find(s=>s.counsellorId===cid && (s.status==="in_session"||s.status==="called"));
const waitMs = s => (s.calledAt||now()) - s.checkinAt;
const isLate = s => s.status==="waiting" && waitMs(s) > S.settings.waitSla*MIN;

function avgSession(cid){
  const done = S.students.filter(s=>s.counsellorId===cid && s.status==="done" && s.startAt && s.endAt);
  if(!done.length) return (co(cid)||{avg:15}).avg*MIN;
  return done.reduce((a,s)=>a+(s.endAt-s.startAt),0)/done.length;
}
function etaFor(s){
  const q = queueFor(s.counsellorId);
  const pos = q.findIndex(x=>x.id===s.id);
  if(pos<0) return {pos:0, eta:0};
  const cur = currentOf(s.counsellorId);
  const avg = avgSession(s.counsellorId);
  let remaining = 0;
  if(cur && cur.startAt) remaining = Math.max(2*MIN, avg-(now()-cur.startAt)); else if(cur) remaining = avg;
  return {pos:pos+1, eta: remaining + pos*avg};
}

/* pick counsellor with the lightest load for a stream */
function assignCounsellor(eventId, stream){
  const pool = eventCounsellors(eventId).filter(c=>c.status!=="offline");
  const match = pool.filter(c=>c.streams.includes(stream));
  const cands = (match.length?match:pool).filter(c=>c.status==="active");
  const final = cands.length?cands:(match.length?match:pool);
  if(!final.length) return null;
  return final.map(c=>({c, load:queueFor(c.id).length + (currentOf(c.id)?1:0)}))
              .sort((a,b)=>a.load-b.load || avgSession(a.c.id)-avgSession(b.c.id))[0].c;
}
function nextToken(eventId, stream){
  S.seq[eventId] = (S.seq[eventId]||0)+1;
  return stream+"-"+pad2(S.seq[eventId]);
}
function sendWA(to, txt){
  if(!S.settings.waEnabled) return;
  S.wa.unshift({t:now(), to, txt, profile:{course:"B.Des / fashion design", exams:["None / not sure"], clarity:"Completely confused", help:["Course selection", "College & course comparison"]}});
  S.wa = S.wa.slice(0,60);
}
function toast(msg, kind){
  const el = document.createElement("div");
  el.className = "toast"+(kind?" "+kind:"");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .4s"; setTimeout(()=>el.remove(),400); }, 3200);
}

function checkIn(data, source){
  const e = ev(data.eventId);
  const dupe = S.students.find(s=>s.phone===data.phone && s.eventId===data.eventId &&
    ["waiting","called","in_session"].includes(s.status));

  const c = assignCounsellor(data.eventId, data.stream);
  if(!c) return {error:"No counsellor is on duty for this centre yet. Reception can add you manually."};
  const s = {

    parentPhone:data.parentPhone||"", eventId:data.eventId, counsellorId:c.id,
    status:"waiting", consent: source==="qr" ? "given":"pending", source, checkinAt:now(),
    calledAt:null, startAt:null, endAt:null, recalls:0, notes:[], feedback:null,
    profile:{city:e?e.city:"", course:data.course||"", exams:data.exams||[],
             clarity:data.clarity||"", help:data.help||[], streamOther:data.streamOther||""}
  };
  S.students.push(s);
  if(source==="reception")
    sendWA(s.phone, `Careers360 ${e?e.city:""}: our front desk has checked you in. Token ${s.token}, counsellor ${c.name} at ${c.desk}. Reply YES to confirm it's you and allow us to use these details for counselling.`);
  else
    sendWA(s.phone, `Careers360 ${e?e.city:""}: you're in the queue. Token ${s.token}, counsellor ${c.name} at ${c.desk}. Keep this chat open — we'll message you when your turn is near.`);
  save();
  return {student:s};
}
function callToken(cid, token){
  const s = S.students.find(x=>x.token.toLowerCase()===String(token).trim().toLowerCase() && x.eventId===co(cid).eventId);
  if(!s) return {error:"No token "+token+" at this centre today."};
  if(s.status==="done") return {error:"Token "+s.token+" was already counselled at "+fmtTime(s.endAt)+"."};
  if(s.counsellorId!==cid){
    s.counsellorId = cid;
    sendWA(s.phone, `Your counsellor changed to ${co(cid).name}, ${co(cid).desk}.`);
  }
  s.status="called"; s.calledAt=now();
  sendWA(s.phone, `It's your turn. Please go to ${co(cid).desk} — ${co(cid).name}. Reply YES to confirm you're here and consent to your details being used for counselling.`);
  save(); return {student:s};
}
function callNext(cid){
  const q = queueFor(cid);
  if(!q.length) return {error:"Queue is empty."};
  return callToken(cid, q[0].token);
}
function startSession(id){ const s=st(id); s.status="in_session"; s.startAt=now(); save(); }
function endSession(id){
  const s=st(id); s.status="done"; s.endAt=now();
  sendWA(s.phone, `Thanks for meeting ${co(s.counsellorId).name}. Your shortlist and next steps are on the way. Rate this session 1-5?`);
  save();
}
function markNoShow(id){
  const s=st(id); s.recalls=(s.recalls||0)+1;
  if(s.recalls>=S.settings.recallLimit){ s.status="no_show"; sendWA(s.phone,`We called ${s.token} ${s.recalls} times. Visit the help desk to get back in the queue.`); }
  else { s.status="waiting"; s.checkinAt=now(); s.calledAt=null;
    sendWA(s.phone,`We called ${s.token} and missed you. You're back in the queue — next call is the last one.`); }
  save();
}

function moveToTop(id){ const s=st(id); const q=queueFor(s.counsellorId); if(q[0]) s.checkinAt=q[0].checkinAt-1000; save(); }
function reassign(id, cid){ const s=st(id); s.counsellorId=cid; s.status="waiting"; s.calledAt=null;
  sendWA(s.phone, `You've been moved to ${co(cid).name}, ${co(cid).desk}. Token ${s.token} stays the same.`); save(); }

/* ---------------- tiny QR-ish glyph (decorative, deterministic) ---------------- */
function qrSVG(seedStr){
  let h=0; for(let i=0;i<seedStr.length;i++) h=(h*31+seedStr.charCodeAt(i))>>>0;
  const n=21, cells=[];
  const rnd=()=>{ h^=h<<13; h>>>=0; h^=h>>17; h^=h<<5; h>>>=0; return h/4294967296; };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const finder = (x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
    if(finder){
      const fx = x<7?x:x-(n-7), fy = y<7?y:y-(n-7);
      const ring = (fx===0||fx===6||fy===0||fy===6), core=(fx>=2&&fx<=4&&fy>=2&&fy<=4);
      if(ring||core) cells.push([x,y]);
    } else if(rnd()>0.55) cells.push([x,y]);
  }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" role="img" aria-label="Check-in QR code">
    <rect width="${n}" height="${n}" fill="var(--card)"/>
    ${cells.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="var(--ink)"/>`).join("")}
  </svg>`;
}

      }).join("")}
      <div class="sep"></div>

function rHall(e){
  const cs = eventCounsellors(e.id);
  const all = eventStudents(e.id);
  const active = all.filter(s=>["waiting","called","in_session"].includes(s.status));
  let who = S.session.hallTab || "all";
  if(who!=="all" && !cs.some(c=>c.id===who)) who="all";
  const q = (S.session.find||"").trim().toLowerCase();

  let rows, mode;
  if(q){
    mode="search";
    rows = all.filter(s=>s.name.toLowerCase().includes(q)||s.phone.includes(q)||s.token.toLowerCase().includes(q))
              .sort((a,b)=>b.checkinAt-a.checkinAt);
  } else {
    mode="queue";
    rows = (who==="all"?active:active.filter(s=>s.counsellorId===who))
              .sort((a,b)=>a.checkinAt-b.checkinAt);
  }
  const late = active.filter(isLate).length;

  const tabs = `<div class="segment">
    <button class="segbtn" data-act="halltab" data-key="all" aria-current="${who==="all"}">
      All students <span class="c">${active.length}</span></button>
    ${cs.map(c=>{
      const n = active.filter(s=>s.counsellorId===c.id).length;
      const lt = active.filter(s=>s.counsellorId===c.id && isLate(s)).length;
      return `<button class="segbtn" data-act="halltab" data-key="${c.id}" aria-current="${who===c.id}">
        ${esc(c.name.split(" ")[0])} <span class="sm">${esc(c.desk)}</span> <span class="c">${n}</span>${lt?` <span class="pill rose" style="font-size:11px">${lt} late</span>`:""}</button>`;
    }).join("")}
  </div>`;

  const row = s => {
    const c = co(s.counsellorId);
    const canRequeue = ["no_show","cancelled","done"].includes(s.status);
    return `<div class="qitem ${mode==="queue"&&s.status==="waiting"&&isLate(s)?"late":""}">
      <div class="num">${esc(s.token)}</div>
      <div><div class="nm">${esc(s.name)}</div>
        <div class="meta">${esc(c.name)} · ${esc(c.desk)} · ${esc(streamName(s.stream))} · ${esc(s.phone)}${
          ["waiting","called"].includes(s.status)?" · waiting "+fmtMins(waitMs(s)):""}</div></div>
      <div class="act">
        ${s.consent==="pending"?`<span class="pill amber">Consent pending</span>`:""}
        ${statusPill(s)}
        ${canRequeue?`<button class="btn sm" data-act="requeue" data-id="${s.id}">Put back in queue</button>`:
          `<select data-act="reassign" data-id="${s.id}" style="width:auto;padding:5px 8px;font-size:13px">
            <option value="">Move to…</option>
            ${cs.filter(x=>x.id!==s.counsellorId).map(x=>`<option value="${x.id}">${esc(x.name)} (${queueFor(x.id).length})</option>`).join("")}
          </select>`}
        <button class="btn ghost sm" data-act="open" data-id="${s.id}">Details</button>
      </div></div>`;
  };

  return `<div class="pagehead"><div><h1>Hall queue</h1>
    <p>Everyone in the room, split by desk. Search finds anyone from today — including lost slips and missed calls.</p></div>
    <div class="right"><span class="pill ${late?"rose":"ok"}">${late} over ${S.settings.waitSla} min</span></div></div>
  <div class="searchrow">
    <input type="text" id="findIn" value="${esc(S.session.find||"")}" placeholder="Search name, mobile or token" autocomplete="off">
    ${q?`<button class="btn ghost sm" data-act="clearfind">Clear search</button>
      <span class="muted" style="font-size:13px">${rows.length} match${rows.length===1?"":"es"} across every status</span>`:
      `<span class="muted" style="font-size:13px">Lost token? Missed call? Search it here.</span>`}
  </div>
  ${q?"":tabs}
  ${rows.length?rows.map(row).join(""):(q
    ? `<div class="empty"><b>No match for “${esc(q)}”</b>Try just the last 4 digits of the number.</div>`
    : `<div class="empty"><b>${who==="all"?"Nobody waiting":"This desk is clear"}</b>Tokens appear here as students scan in.</div>`)}`;
}

    <p>Who covers which streams, where they're posted, and how they're performing.</p></div>

  <div class="tablewrap"><table>
    <thead><tr><th>Counsellor</th><th>Streams</th><th>Posted to</th><th>Status</th><th>Done</th><th>Avg session</th><th>Ready to apply</th><th></th></tr></thead>
    <tbody>${S.counsellors.map(c=>{
      const mine=S.students.filter(s=>s.counsellorId===c.id), done=mine.filter(s=>s.status==="done");
      return `<tr><td><div style="font-weight:500">${esc(c.name)}</div><div class="muted" style="font-size:12px">${esc(c.phone)}</div></td>
        <td>${c.streams.map(streamName).join(", ")}</td>
        <td>${esc(ev(c.eventId).city)} · ${esc(c.desk)}<div class="muted" style="font-size:12px">${prettyDate(ev(c.eventId).date)}</div></td>
        <td><span class="pill ${c.status==="active"?"ok":c.status==="break"?"amber":"grey"}">${c.status==="active"?"On desk":c.status==="break"?"Break":"Off duty"}</span></td>
        <td>${done.length}</td><td>${done.length?Math.round(avgSession(c.id)/MIN)+" min":"—"}</td>
        <td>${done.filter(s=>(s.profile||{}).outcome==="hot").length}</td>
        <td><button class="btn ghost sm" data-act="impersonate" data-id="${c.id}">Open desk</button></td></tr>`;
    }).join("")}</tbody></table></div>`;
}
function aStudents(){
  const f = S.session.filter||{};
  let list = S.students.slice().sort((a,b)=>b.checkinAt-a.checkinAt);
  if(f.event) list=list.filter(s=>s.eventId===f.event);
  if(f.stream) list=list.filter(s=>s.stream===f.stream);
  if(f.status) list=list.filter(s=>s.status===f.status);
  if(f.counsellor) list=list.filter(s=>s.counsellorId===f.counsellor);
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(s=>s.name.toLowerCase().includes(q)||s.phone.includes(q)||s.token.toLowerCase().includes(q)); }
  return `<div class="pagehead"><div><h1>All students</h1>
    <p>Every student who has ever walked into a counselling centre — searchable, filterable, exportable.</p></div>
    <div class="right"><button class="btn ghost" data-act="export">Export CSV</button></div></div>
  <div class="card" style="margin-bottom:14px"><div class="grid g3" style="gap:10px">
    <input type="text" data-flt="q" value="${esc(f.q||"")}" placeholder="Name, number or token">
    <select data-flt="counsellor"><option value="">All counsellors</option>${S.counsellors.map(c=>`<option value="${c.id}" ${f.counsellor===c.id?"selected":""}>${esc(c.name)} · ${esc(ev(c.eventId).city)}</option>`).join("")}</select>
    <select data-flt="event"><option value="">All centres</option>${S.events.map(e=>`<option value="${e.id}" ${f.event===e.id?"selected":""}>${esc(e.city)} · ${prettyDate(e.date)}</option>`).join("")}</select>

  </div></div>
  <p class="muted" style="font-size:13px;margin:0 0 10px">${list.length} of ${S.students.length} records</p>

}
function aInsights(){
  const all=S.students, done=all.filter(s=>s.status==="done");
  const waits=all.filter(s=>s.calledAt).map(s=>s.calledAt-s.checkinAt);
  const avgWait = waits.length?waits.reduce((a,b)=>a+b,0)/waits.length:0;
  const sess = done.filter(s=>s.startAt&&s.endAt).map(s=>s.endAt-s.startAt);
  const avgSess = sess.length?sess.reduce((a,b)=>a+b,0)/sess.length:0;
  const noshow = all.filter(s=>s.status==="no_show").length;
  const hot = done.filter(s=>(s.profile||{}).outcome==="hot").length;
  const byStream = STREAMS.map(s=>({...s, n:all.filter(x=>x.stream===s.code).length})).filter(s=>s.n).sort((a,b)=>b.n-a.n);
  const max = Math.max(1,...byStream.map(s=>s.n));
  const rated = all.filter(s=>s.feedback);
  const csat = rated.length?(rated.reduce((a,s)=>a+s.feedback,0)/rated.length).toFixed(1):"—";
  return `<div class="pagehead"><div><h1>Insights</h1>
    <p>The numbers that tell you whether the next city goes better than the last one.</p></div></div>
  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat"><div class="n">${all.length}</div><div class="l">Students counselled or queued</div></div>
    <div class="stat"><div class="n">${Math.round(avgWait/MIN)}</div><div class="l">Avg wait (min)</div><div class="d muted">Promise is ${S.settings.waitSla} min</div></div>
    <div class="stat"><div class="n">${Math.round(avgSess/MIN)}</div><div class="l">Avg session (min)</div><div class="d muted">Target ${S.settings.targetSession} min</div></div>
    <div class="stat"><div class="n">${all.length?Math.round(noshow/all.length*100):0}%</div><div class="l">No-show rate</div><div class="d muted">${noshow} student${noshow===1?"":"s"}</div></div>
  </div>
  <div class="grid g3">
    <div class="card"><h3>Demand by stream</h3>
      ${byStream.map(s=>`<div style="margin-bottom:10px"><div class="rowsplit" style="font-size:13px"><span>${s.name}</span><b style="margin-left:auto">${s.n}</b></div>
        <div style="height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px">
        <div style="height:100%;width:${Math.round(s.n/max*100)}%;background:var(--navy)"></div></div></div>`).join("")}
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">Staff the next city against this, not against last year's guess.</p>
    </div>
    <div class="card"><h3>What students asked for</h3>
      ${HELP.map(h=>{const n=all.filter(s=>((s.profile||{}).help||[]).includes(h)).length;
        return n?`<div class="kv"><span>${h}</span><b>${n}</b></div>`:"";}).join("")}
      <div class="sep"></div>
      ${CLARITY.map(c=>{const n=all.filter(s=>(s.profile||{}).clarity===c).length;
        return n?`<div class="kv"><span>${c}</span><b>${n}</b></div>`:"";}).join("")}
      <p class="muted" style="font-size:12.5px;margin:12px 0 0">The clarity mix predicts session length — confused students need longer than shortlisters.</p>
    </div>
    <div class="card"><h3>Counselling outcomes</h3>
      ${OUTCOMES.map(o=>{const n=done.filter(s=>(s.profile||{}).outcome===o.v).length;
        return `<div class="kv"><span>${o.l}</span><b>${n}</b></div>`;}).join("")}
      <div class="kv"><span>Not recorded</span><b>${done.filter(s=>!(s.profile||{}).outcome).length}</b></div>
      <div class="sep"></div>
      <div class="kv"><span>Follow-ups scheduled</span><b>${all.filter(s=>(s.profile||{}).followUp).length}</b></div>
      <div class="kv"><span>Student rating</span><b>${csat}${rated.length?" / 5 · "+rated.length+" ratings":""}</b></div>
    </div>
  </div>`;
}
/* ---------------- HALL BOARD ---------------- */
function viewBoard(){
  const e = ev(S.session.eventId) || S.events[0];
  const cs = eventCounsellors(e.id);
  const waiting = eventStudents(e.id).filter(s=>s.status==="waiting");
  const recent = eventStudents(e.id).filter(s=>s.calledAt).sort((a,b)=>b.calledAt-a.calledAt).slice(0,6);
  return `<div class="board">
    <div class="rowsplit"><div><h1>${esc(e.city)} counselling — now serving</h1>
      <div class="sub">${esc(e.venue)} · ${prettyDate(e.date)}</div></div>
      <div style="margin-left:auto;text-align:right"><div style="font-family:var(--serif);font-size:34px;line-height:1" id="boardclock"></div>
      <div class="sub">${waiting.length} waiting</div></div></div>
    <div class="deskgrid">${cs.map(c=>{
      const cur=currentOf(c.id), q=queueFor(c.id);
      return `<div class="desk ${cur?"":"idle"}">
        <div class="who">${esc(c.desk)} · ${esc(c.name)}</div>
        <div class="serving">${cur?esc(cur.token):"—"}</div>
        <div class="nxt">${c.status!=="active"?(c.status==="break"?"Back shortly":"Closed"):q.length?"Next: "+esc(q[0].token)+" · "+q.length+" waiting":"Queue clear"}</div>
      </div>`;
    }).join("")}</div>
    <div class="ticker">Recently called — ${recent.length?recent.map(s=>esc(s.token)).join("  ·  "):"nothing yet"}</div>
    <div class="ticker" style="border:none;padding-top:6px;opacity:.6">Scan the code at the entrance to join. Keep your phone on — we message you when your turn is near.</div>
  </div>`;
}

/* ---------------- csv ---------------- */
function exportCSV(){
  const head = ["Token","Name","School","Phone","Parent contact","Email","Stream","Class","Targeting","Entrance exams","Clarity","Help wanted with","City","Date","Counsellor","Checked in","Called","Wait (min)","Session (min)","Status","Outcome","Follow-up","Notes"];
  const rows = S.students.map(s=>{
    const p=s.profile||{}, e=ev(s.eventId);
    return [s.token,s.name,s.school||"",s.phone,s.parentPhone||"",s.email||"",streamName(s.stream),s.klass||"",
      p.course||"",(p.exams||[]).join(" / "),p.clarity||"",(p.help||[]).join(" / "),e.city,e.date,co(s.counsellorId).name,
      fmtTime(s.checkinAt),fmtTime(s.calledAt),Math.round(waitMs(s)/MIN),
      s.startAt&&s.endAt?Math.round((s.endAt-s.startAt)/MIN):"",s.status,
      (OUTCOMES.find(o=>o.v===p.outcome)||{l:""}).l, p.followUp||"",
      (s.notes||[]).map(n=>n.txt).join(" | ")];
  });
  const csv = [head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  try{
    const a=document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download = "counselqueue-students.csv"; a.click();
    toast("CSV downloaded","ok");
  }catch(err){ toast("Download blocked here — copy from the table instead","warn"); }
}

<script>
"use strict";
/* ---------------- permissions ---------------- */
const NAV = {
  superadmin:[["live","Live centres"],["events","Centres & dates"],["team","Counsellors"],
              ["students","All students"],["insights","Insights"],["hall","Hall queue"],["board","Hall board"]],
  reception:[["hall","Hall queue"],["addstudent","Add a student"],["board","Hall board"]],
  counsellor:[["queue","My queue"],["session","Live session"],["mine","My students"],["roster","My centres"]]
};
const EXTRA = { superadmin:["queue","session","mine"], reception:[], counsellor:[] };
const can = v => { const u=me(); if(!u) return false;
  return NAV[u.role].some(x=>x[0]===v) || EXTRA[u.role].includes(v); };
const initials = n => n.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();
const roleLabel = r => ({superadmin:"Super admin", reception:"Front desk", counsellor:"Counsellor"}[r]||r);

  const u = me();
  if(v==="hall") return eventStudents(S.session.eventId).filter(s=>s.status==="waiting").length;

          <span class="pwwrap"><input type="${show?"text":"password"}" name="pass" id="loginPass" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="pwtoggle" data-act="togglepw">${show?"Hide":"Show"}</button></span></label>
        <button class="btn big" type="submit" style="margin-top:6px">Sign in</button>
      </form>
      <div class="loginfoot">
        <button class="linkbtn" data-act="demokeys" style="font-size:12px;font-weight:400">${S.session.showDemo?"Hide":"Show"} prototype accounts</button>
      </div>
      ${S.session.showDemo?`<div class="demokeys">
        <p class="muted" style="font-size:12px;margin:0 0 10px">Prototype only — these would not exist in production. Tap one to fill the form.</p>
        ${demo.map(([em,pw,nm,ti])=>`<button class="acct" data-act="fill" data-email="${em}" data-pass="${pw}">
          <span class="av">${esc(initials(nm))}</span><span><b>${esc(nm)}</b><span>${esc(ti)} · ${em} · ${pw}</span></span></button>`).join("")}
      </div>`:""}
    </div></div></div>`;
}
function render(){
  const root = document.getElementById("root");
  const u = me();
  if(!u){ root.innerHTML = viewLogin(S.session.loginErr); save(); return; }
  if(!S.session.view || !can(S.session.view)) S.session.view = defaultView();
  if(S.session.view==="board"){
    root.innerHTML = `<div class="boardfull">${viewBoard()}
      <button class="btn sm leaveboard" data-act="nav" data-key="${defaultView()}">Leave board</button></div>`;
    save(); tickClock(); return;
  }
  root.innerHTML = topbar() + `<div class="app">
    <aside class="rail">
      <div class="who"><b>${esc(u.name)}</b><span>${esc(u.title||roleLabel(u.role))}</span></div>
      ${railNav()}
    </aside>
    <section class="main">${deskBanner()}${sectionBody()}</section>
  </div>`;
  save(); tickClock();
}
function validPhone(v){ return /^[0-9]{10}$/.test(String(v).replace(/\D/g,"")); }
function validEmail(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); }

/* ---------------- clock ---------------- */
function tickClock(){
  const d=new Date(), s=pad2(d.getHours())+":"+pad2(d.getMinutes());
  const c=document.getElementById("clock"); if(c) c.textContent=s;
  const b=document.getElementById("boardclock"); if(b) b.textContent=s;
  const tm=document.getElementById("timer");
  if(tm){ const cur=currentOf(S.session.counsellorId); if(cur&&cur.startAt) tm.textContent=fmtDur(now()-cur.startAt); }
}
setInterval(tickClock,1000);
setInterval(()=>{ if(S.session.view==="board" && me()) render(); }, 15000);

/* ---------------- events ---------------- */
document.addEventListener("click", e2 => {
  const t = e2.target.closest("[data-act]"); if(!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  const cid = S.session.counsellorId;
  switch(a){
    case "fill": document.getElementById("loginEmail").value=t.dataset.email;
      document.getElementById("loginPass").value=t.dataset.pass; break;
    case "togglepw": S.session.showPw=!S.session.showPw; render(); break;
    case "demokeys": S.session.showDemo=!S.session.showDemo; render(); break;
    case "signout": S.session.authUserId=null; S.session.view=""; save(); closeModal(); toast("Signed out"); render(); break;
    case "nav": S.session.view=t.dataset.key; render(); break;
    case "closebg": if(e2.target.classList.contains("modalbg")) closeModal(); break;
    case "closemodal": closeModal(); break;
    case "open": studentModal(id); break;

    case "cstatus": { const c=co(cid); c.status=t.dataset.v; save();
      toast("Marked "+(c.status==="active"?"on desk":c.status==="break"?"on a break":"off duty")); render(); break; }
    case "callnext": { const r=callNext(cid); if(r.error) toast(r.error,"bad"); else { toast("Called "+r.student.token,"ok"); S.session.view="session"; } render(); break; }
    case "calltok": { const v=document.getElementById("tokIn").value; if(!v){toast("Type a token first","warn");break;}
      const r=callToken(cid,v); if(r.error) toast(r.error,"bad"); else { toast("Called "+r.student.token,"ok"); S.session.view="session"; } render(); break; }
    case "calltokid": { const r=callToken(cid, st(id).token); if(r.error) toast(r.error,"bad"); else { toast("Called "+r.student.token,"ok"); S.session.view="session"; } render(); break; }
    case "totop": moveToTop(id); toast("Pulled forward"); render(); break;
    case "consent": giveConsent(id); toast("Consent recorded","ok"); render(); break;
    case "resend": { const s=st(id); sendWA(s.phone,"Please confirm it's you and allow counselling use of your details. Token "+s.token+"."); save(); toast("WhatsApp resent"); render(); break; }
    case "start": startSession(id); toast("Session started","ok"); render(); break;
    case "end": { endSession(id); const q=queueFor(cid);
      toast("Session complete"+(q.length?" · "+q[0].token+" is up next":""),"ok"); S.session.view="queue"; render(); break; }
    case "noshow": { markNoShow(id); const s=st(id);
      toast(s.status==="no_show"?s.token+" marked as no-show":s.token+" put back in the queue","warn");
      S.session.view="queue"; render(); break; }
    case "note": { const box=document.getElementById("noteBox"); const v=box.value.trim();
      if(!v){toast("Write something first","warn");break;} addNote(id, co(cid).name, v); toast("Note added","ok"); render(); break; }
    case "requeue": requeue(id); closeModal(); toast("Back in the queue","ok"); render(); break;
    case "halltab": S.session.hallTab=t.dataset.key; render(); break;
    case "clearfind": S.session.find=""; render(); break;
    case "clearflt": S.session.filter={}; render(); break;

    case "impersonate": S.session.counsellorId=id; S.session.eventId=co(id).eventId; S.session.view="queue"; render(); break;
    case "newevent": eventModal(null); break;
    case "editevent": eventModal(id); break;
    case "evstatus": { const e3=ev(id); e3.status = e3.status==="live"?"closed":"live"; save();
      toast(e3.city+" is "+(e3.status==="live"?"live":"closed")); render(); break; }
    case "newcoun": counModal(null); break;
    case "addcoun": counModal(id); break;
    case "export": exportCSV(); break;
  }
});
document.addEventListener("change", e2 => {
  const sel = e2.target.closest("[data-act='reassign']");
  if(sel && sel.value){ reassign(sel.dataset.id, sel.value); toast("Moved to "+co(sel.value).name,"ok"); render(); return; }
  const flt = e2.target.closest("[data-flt]");
  if(flt){ S.session.filter = Object.assign({}, S.session.filter, {[flt.dataset.flt]: flt.value}); render(); }
});
document.addEventListener("input", e2 => {
  if(e2.target.id==="findIn"){ S.session.find = e2.target.value; clearTimeout(window._ft);
    window._ft = setTimeout(()=>{ const v=S.session.find; render(); const el=document.getElementById("findIn");
      if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } }, 260); }
});
document.addEventListener("submit", e2 => {
  e2.preventDefault();
  const f = e2.target;
  if(f.id==="loginForm"){
    const d = Object.fromEntries(new FormData(f).entries());
    const email = String(d.email||"").trim().toLowerCase();
    if(!email || !d.pass){ S.session.loginErr="Enter your work email and password."; render(); return; }
    const u = (S.users||[]).find(x=>x.email.toLowerCase()===email);
    if(!u || u.pass!==d.pass){
      S.session.loginTries=(S.session.loginTries||0)+1;
      S.session.loginErr="That email and password don't match an account.";
      render(); return;
    }
    S.session.authUserId=u.id; S.session.loginErr=null; S.session.loginTries=0; S.session.showPw=false;
    if(u.counsellorId) S.session.counsellorId=u.counsellorId;
    if(u.eventId) S.session.eventId=u.eventId;
    else S.session.eventId = (S.events.find(x=>x.status==="live")||S.events[0]).id;
    S.session.view = defaultView();
    toast("Signed in as "+roleLabel(u.role),"ok"); render(); return;
  }
  if(f.id==="rform"){
    const fd = new FormData(f);
    const d = Object.fromEntries(fd.entries());
    d.exams = fd.getAll("exams"); d.help = fd.getAll("help");
    const errs=[];
    if(!d.name || d.name.trim().length<3) errs.push("Enter the student's full name.");
    if(!validPhone(d.phone)) errs.push("A 10-digit mobile number is needed.");
    if(d.parentPhone && !validPhone(d.parentPhone)) errs.push("The parent's number should be 10 digits, or left blank.");
    if(!d.help.length) errs.push("Pick at least one thing they want help with.");
    if(errs.length){ document.getElementById("rformerr").innerHTML = errs.map(x=>`<span class="err">${esc(x)}</span>`).join(""); return; }
    const res = checkIn({...d, eventId:S.session.eventId}, "reception");
    if(res.error){ document.getElementById("rformerr").innerHTML=`<span class="err">${esc(res.error)}</span>`; return; }
    toast("Token "+res.student.token+" issued to "+co(res.student.counsellorId).name,"ok");
    S.session.view="hall"; render(); return;
  }
  if(f.id==="detForm"){
    const s = st(f.dataset.id), d = Object.fromEntries(new FormData(f).entries());
    s.name=d.name; s.phone=d.phone; s.email=d.email; s.stream=d.stream; s.klass=d.klass;
    s.school=d.school; s.parentPhone=d.parentPhone;
    s.profile = Object.assign({}, s.profile, {city:d.city, target:d.target, budget:d.budget,
      outcome:d.outcome, colleges:d.colleges, followUp:d.followUp, withWhom:d.withWhom,
      course:d.course, clarity:d.clarity});
    save(); toast("Details saved","ok"); render(); return;
  }
  if(f.id==="evForm"){
    const d = Object.fromEntries(new FormData(f).entries());
    if(!d.city || !d.venue){ document.getElementById("evErr").innerHTML=`<span class="err">City and venue are both needed.</span>`; return; }
    if(f.dataset.id){ Object.assign(ev(f.dataset.id), {city:d.city, venue:d.venue, date:d.date, start:d.start, end:d.end, capacity:+d.capacity}); toast("Centre updated","ok"); }
    else { const id2=uid("ev_"); S.events.push({id:id2, city:d.city, venue:d.venue, date:d.date, start:d.start, end:d.end, status:"planned", capacity:+d.capacity});
      S.seq[id2]=0; toast(d.city+" added","ok"); }
    save(); closeModal(); render(); return;
  }
  if(f.id==="cnForm"){
    const fd = new FormData(f), streams = fd.getAll("stream");
    const d = Object.fromEntries(fd.entries());
    if(!d.name || !streams.length){ document.getElementById("cnErr").innerHTML=`<span class="err">A name and at least one stream are needed.</span>`; return; }
    S.counsellors.push({id:uid("c_"), name:d.name, phone:d.phone||"—", desk:d.desk||"Desk", streams, eventId:d.eventId, status:"offline", avg:15});
    save(); closeModal(); toast(d.name+" added","ok"); render(); return;
  }
});
document.addEventListener("keydown", e2 => { if(e2.key==="Escape" && MODAL) closeModal(); });
document.addEventListener("click", e2 => {
  if(e2.target.id==="themeBtn"){
    const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light":"dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("counselqueue.theme", next); }catch(e){}
  }
});
try{ const th=localStorage.getItem("counselqueue.theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
render(); tickClock();
</script>
</body>
</html>
